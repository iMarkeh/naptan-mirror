<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naptan Mirror</title>
<style>
table { border-collapse: collapse; margin: 1em 0; }
th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
th { background: #eee; }
</style>
</head>
 <body>
<h1>Naptan Mirror</h1>
<p><a href="https://github.com/iMarkeh/naptan-mirror/releases/download/data/naptan.json">naptan.json</a> &mdash; dataset (JSON)</p>
<p><a href="https://github.com/iMarkeh/naptan-mirror/releases/download/data/naptan.csv">naptan.csv</a> &mdash; dataset (CSV)</p>
<p><strong>Last refreshed:</strong> Monday, 10 August 2026 at 11:01</p>
<p>Stop data updates around 1am, 9am &amp; 5pm</p>

<p><button id="refreshBtn">Refresh now</button> <span id="refreshStatus"></span></p>
<script>
document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  const status = document.getElementById('refreshStatus');
  btn.disabled = true;
  status.textContent = 'Requesting…';
  try {
    const res = await fetch('/refresh', { method: 'POST' });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok) {
      status.textContent = 'Refresh started.';
    } else if (res.status === 429) {
      status.textContent = 'Already refreshed recently — try again later.';
    } else {
      status.textContent = 'Failed (' + (data.error || res.status) + '): ' + (data.detail || '');
    }
  } catch {
    status.textContent = 'Request failed.';
  }
  btn.disabled = false;
});
</script>
</body>
</html>
