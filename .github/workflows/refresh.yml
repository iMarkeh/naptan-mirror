name: Refresh Naptan cache

on:
  schedule:
    # Every 8 hours UTC (00:00, 08:00, 16:00)
    - cron: '0 */8 * * *'
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write
  deployments: write

concurrency:
  group: naptan-refresh
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Download & transform NaPTAN
        env:
          NAPTAN_URL: ${{ vars.NAPTAN_URL }}
        run: node scripts/build.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=naptan-mirror --branch main

      - name: Publish data files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the fixed 'data' release once (tag only, no files yet).
          if ! gh release view data >/dev/null 2>&1; then
            gh release create data \
              --title "Naptan data" \
              --notes "Auto-refreshed every 8 hours. Files replaced in place." \
              --latest=false
          fi
          # Replace the files in that release, keeping the URLs stable.
          gh release upload data data/naptan.csv data/naptan.json --clobber

      - name: Commit refreshed data
        run: |
          git checkout "$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/meta.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh NaPTAN data"
            git push
          fi
