name: Refresh Naptan cache

on:
  schedule:
    # Every 8 hours UTC (00:00, 08:00, 16:00)
    - cron: '0 */8 * * *'
  workflow_dispatch: {}     # manual "Run workflow" button

permissions:
  contents: write
  deployments: write

concurrency:
  group: naptan-refresh
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download & transform NaPTAN
        env:
          NAPTAN_URL: ${{ vars.NAPTAN_URL }}
        run: node scripts/build.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=naptan-mirror --branch main

      - name: Commit refreshed data
        run: |
          git checkout "$GITHUB_REF_NAME"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html public/meta.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh NaPTAN data"
            git push
          fi
